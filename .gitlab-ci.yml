# 临时环境探测配置（正式全套门禁配置将在探测后写入）
# 此 job 只读取 runner 宿主的工具链信息，不执行任何构建/测试。

probe:
  stage: build
  script:
    - echo "=== WHOAMI / PWD ==="
    - whoami; pwd; uname -a
    - echo "=== OS ==="
    - cat /etc/os-release 2>/dev/null | head -5
    - echo "=== PYTHON ==="
    - (python3 --version && which python3) || echo "python3 MISSING"
    - (pip3 --version && which pip3) || echo "pip3 MISSING"
    - echo "=== NODE ==="
    - (node --version && which node) || echo "node MISSING"
    - (npm --version && which npm) || echo "npm MISSING"
    - echo "=== UV ==="
    - (uv --version && which uv) || echo "uv MISSING"
    - echo "=== GIT / CURL ==="
    - git --version; curl --version | head -1
    - echo "=== SUDO ==="
    - (sudo -n true 2>/dev/null && echo "sudo NOPASSWD OK") || echo "sudo NOT AVAILABLE"
    - echo "=== PATH ==="
    - echo "$PATH"
    - echo "=== PROBE DONE ==="

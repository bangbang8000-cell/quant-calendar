<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="qc-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <!-- 品牌渐变底 -->
  <rect width="100" height="100" rx="20" fill="url(#qc-g)"/>
  <!-- 日历轮廓 -->
  <rect x="24" y="30" width="52" height="44" rx="7" fill="none" stroke="#fff" stroke-width="3.5" opacity="0.95"/>
  <!-- 顶部日期条 -->
  <rect x="24" y="30" width="52" height="11" rx="4" fill="#fff" opacity="0.9"/>
  <!-- 挂扣 -->
  <rect x="34" y="25" width="4" height="7" rx="2" fill="#fff" opacity="0.8"/>
  <rect x="62" y="25" width="4" height="7" rx="2" fill="#fff" opacity="0.8"/>
  <!-- 日历格分隔(浅) -->
  <line x1="41" y1="46" x2="41" y2="72" stroke="#fff" stroke-width="1.6" opacity="0.45"/>
  <line x1="59" y1="46" x2="59" y2="72" stroke="#fff" stroke-width="1.6" opacity="0.45"/>
  <!-- 上升 K 线折线 (3 段) -->
  <polyline points="33,70 44,58 56,52 70,38" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 折线阴影(叠加深紫提升立体) -->
  <polyline points="33,72 44,60 56,54 70,40" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.12"/>
  <!-- 高亮顶点 -->
  <circle cx="70" cy="38" r="4" fill="#fff"/>
  <circle cx="70" cy="38" r="2.2" fill="#764ba2"/>
</svg>
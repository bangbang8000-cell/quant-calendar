    <script nonce="{{NONCE}}">
    // Token 自动附加拦截器 - 修复 401 问题
    (function() {
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
            const url = args[0];
            const options = args[1] || {};
            
            // 只给 /api 请求加 Token
            if (url.startsWith('/api/')) {
                const token = localStorage.getItem('quant_token');
                if (token) {
                    options.headers = options.headers || {};
                    options.headers['Authorization'] = 'Bearer ' + token;
                }
            }
            
            return originalFetch.apply(this, args);
        };
    })();
</script>
    <script nonce="{{NONCE}}">
        // ===== Vue 应用初始化 =====
        console.log('[DEBUG] App init script starting');
        const { createApp, ref, computed, onMounted, onUnmounted, watch, nextTick, provide } = Vue;
        console.log('[DEBUG] Vue destructured, creating app');
        const app = createApp({
            setup() {
                console.log('[DEBUG] setup() started');
                // v3.6.0-T8: 逻辑已提取至 js/app-logic.js
                const qcState = window.createAppLogic();
                provide('qcState', qcState);
                return qcState;
            }
        });

        // 配置Element Plus中文语言
        if (ElementPlusLocaleZhCn && ElementPlusLocaleZhCn.default) {
            app.use(ElementPlus, {
                locale: ElementPlusLocaleZhCn.default
            });
        } else if (ElementPlusLocaleZhCn) {
            app.use(ElementPlus, {
                locale: ElementPlusLocaleZhCn
            });
        } else {
            app.use(ElementPlus);
        }
        // v1.5.0: 点击外部关闭指令
        app.directive('click-outside', {
            mounted(el, binding) {
                el.__clickOutside = (event) => {
                    if (!el.contains(event.target)) {
                        binding.value(event);
                    }
                };
                document.addEventListener('click', el.__clickOutside);
            },
            unmounted(el) {
                document.removeEventListener('click', el.__clickOutside);
            }
        });
        console.log('[DEBUG] About to mount app');
        // v3.6.0: 注册全局组件 (零构建, 用组件 name 属性保证 kebab-case 正确)
        if (window.__quantComponents) {
            Object.values(window.__quantComponents).forEach((comp) => {
                if (comp && comp.name) {
                    app.component(comp.name, comp);
                }
            });
        }
        app.mount('#app');
        console.log('[DEBUG] App mounted');

    </script>

    <!-- Module JS (v3.17.9: 全部 defer, 按文档顺序执行, 依赖通过 window.__quantModules 全局保持) -->

<script type="module" crossorigin src="/assets/index-DIgYFHUs.js"></script>

<body>
    <!-- v3.17.9 (FR-3.17.9): 首屏启动骨架屏 — 纯 CSS 类（无内联样式），

        </div>

        <!-- 主界面 --><template v-else>
            <div :class="'icon-system-' + iconSystem">
            <!-- 桌面端左侧导航 (v3.6.0-T3: 组件化) -->
            <qc-sidebar></qc-sidebar>

            <!-- 主内容区 -->
            <div class="main-content" :class="{ expanded: sidebarCollapsed }" @touchstart="onTouchStart" @touchend="onTouchEnd">

                <!-- v3.6.0-T3: 全局 Header + 面包屑 (组件化) -->
                <qc-global-header></qc-global-header>

                <!-- V4.3-S3: 页面组件动态渲染 — pageComp 映射 currentPage -> 组件名 -->
                <!-- 懒加载组件(chunk)注册后, :is 每次渲染重新 resolveComponent 即命中 -->
                <Transition name="fade-slide" mode="out-in">
                <KeepAlive>
                <component :is="pageComp"></component>
                </KeepAlive>
                </Transition>
            </div>

            <!-- 移动端底部导航 -->
            <div class="mobile-nav">

                    <div class="mobile-nav-icon" v-html="sanitizeHtml(menu.icon)"></div>

            </div>
            </div>

</template>

        <!-- v3.11 (FR-3.11.2): 股票详情对话框 — 移至 components/dialogs/ -->

</div>

    <!-- v3.17.9 (FR-3.17.9): 内联启动脚本全部延迟到 DOMContentLoaded 执行 —
         defer 的模块脚本在 DOM 解析完成后、DOMContentLoaded 前按序执行，故此处可安全引用 window.__quantModules -->
    <script nonce="{{NONCE}}">
    // v3.17.11 (FR-3.17.11.3/4): 鉴权注入唯一实现收敛至 core.js withAuthHeaders
    // 全局 fetch monkey-patch 保留（SSE 流式/文件下载/直接 fetch 均依赖其注入 Token），
    // 但不再重复实现 Authorization 拼接 —— 仅委托 __quantModules.core.withAuthHeaders。
    document.addEventListener('DOMContentLoaded', function () {
        const originalFetch = window.fetch;
        const core = (window.__quantModules && window.__quantModules.core) || {};
        const withAuthHeaders = (typeof core.withAuthHeaders === 'function')
            ? core.withAuthHeaders
            : function(url, options) { return options; };
        window.fetch = function(...args) {
            const url = args[0];
            const options = args[1] || {};
            const opts = withAuthHeaders(url, options);
            return originalFetch.apply(this, [url, opts]);
        };
    });
</script>
    <script nonce="{{NONCE}}">
        // ===== Vue 应用初始化 (v3.17.9: 延迟到 DOMContentLoaded, 先于模块脚本执行完) =====
        // 保持 Vue 解构为「顶层 var 全局词法绑定」: 各域模块(app-logic/market.js 等)裸引用
        // ref/computed/watch/nextTick 依赖此声明 (原同步方案由顶层 const 提供, defer 后需显式声明)。
        // 赋值延迟到 DOMContentLoaded (Vue 已加载), 域模块在 create 时调用, 时序安全。
        var createApp, ref, computed, onMounted, onUnmounted, watch, nextTick, provide;
        document.addEventListener('DOMContentLoaded', function () {
        ({ createApp, ref, computed, onMounted, onUnmounted, watch, nextTick, provide } = Vue);
        const app = createApp({
            setup() {
                // v3.6.0-T8: 逻辑已提取至 js/app-logic.js
                const qcState = window.createAppLogic();
                provide('qcState', qcState);
                return qcState;
            }
        });

        // 配置Element Plus中文语言
        if (ElementPlusLocaleZhCn && ElementPlusLocaleZhCn.default) {
            app.use(ElementPlus, {
                locale: ElementPlusLocaleZhCn.default
            });
        } else if (ElementPlusLocaleZhCn) {
            app.use(ElementPlus, {
                locale: ElementPlusLocaleZhCn
            });
        } else {
            app.use(ElementPlus);
        }
        // v1.5.0: 点击外部关闭指令
        app.directive('click-outside', {
            mounted(el, binding) {
                el.__clickOutside = (event) => {
                    if (!el.contains(event.target)) {
                        binding.value(event);
                    }
                };
                document.addEventListener('click', el.__clickOutside);
            },
            unmounted(el) {
                document.removeEventListener('click', el.__clickOutside);
            }
        });
        // v3.6.0: 注册全局组件 (零构建, 用组件 name 属性保证 kebab-case 正确)
        if (window.__quantComponents) {
            Object.values(window.__quantComponents).forEach((comp) => {
                if (comp && comp.name) {
                    app.component(comp.name, comp);
                    comp.__quantRegistered = true;
                }
            });
        }
        app.mount('#app');
        // V4.3-S3: 暴露 app 实例 — 懒加载页面组件需在 chunk 加载后补注册 app.component
        window.__quantApp = app;

        // v3.17.9 (FR-3.17.9): 挂载完成立即移除启动骨架屏（首屏主区域随后由各页状态面板骨架接管）
        const bootEl = document.getElementById('qc-boot');
        if (bootEl) bootEl.remove();
        });

    </script>
    <script nonce="{{NONCE}}">
        // v3.17.8 (FR-3.17.8): PWA Service Worker 注册 + 移动端手势装配
        // - SW: cacheName 含 APP_VERSION（后端 /sw.js 注入），发布新版本即缓存爆破
        // - 手势: 左滑露出操作 / 长按复制代码（委托式，仅移动端生效由 CSS/touch 天然限制）
        document.addEventListener('DOMContentLoaded', function () {
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('/sw.js').catch(function (err) {
                        console.warn('[sw] 注册失败:', err);
                    });
                });
            }
            if (window.__quantModules && window.__quantModules.gestures
                && typeof window.__quantModules.gestures.initGestures === 'function') {
                window.__quantModules.gestures.initGestures();
            }
        });
    </script>
</body>
</html>

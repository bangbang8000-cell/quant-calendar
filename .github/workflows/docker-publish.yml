name: Docker Build & Publish

on:
  push:
    tags:
      - 'v*'            # 推送版本标签时触发
  workflow_dispatch:      # 手动触发（可指定版本）
    inputs:
      mode:
        description: 'build=构建并发布 / prune=仅清理历史镜像版本 / all=两者都跑'
        type: choice
        options:
          - build
          - prune
          - all
        default: build

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 留存上限：保留最近 KEEP_VERSIONS 个发行版本，更早的连同其浮动别名标签一并删除。
  # 2026-11-03 用户决策：当前 5 个全部保留 → 上限放到 10；新版本累积到 10 个后开始滚动淘汰最老的。
  # 想收紧回 5：把 10 改成 5 即可（下一次 prune 立即按新上限裁）。
  KEEP_VERSIONS: 10

jobs:
  build-and-push:
    # 构建门槛（2026-11-03 用户决策："小版本不用编译容器版本，只有关键版本才需要"）：
    #   ① push tag：只有**关键版本**才构建 —— 判定式 = 版本号 patch 位为 0（如 v6.7.0 / v7.0.0）
    #      这类是里程碑版本；v6.7.1、v6.5.8 这类小版本只打 tag，不产生新容器镜像。
    #   ② workflow_dispatch：mode=build/all 时无条件构建（用于给小版本补镜像、或重建历史版本）。
    # 判据用「tag 名以 .0 结尾」而非改版本号规则：不需要任何人记住约定，检查日志即可复核。
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'prune') ||
      (github.event_name == 'push' && github.ref_type == 'tag' && endsWith(github.ref_name, '.0'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 防呆：semver 标签由 metadata-action 从 tag ref 推导，分支 ref 只会产出 latest=none
      # → 与其让构建在推送阶段失败，不如在这里给出可执行的修复指引
      - name: 校验构建来源必须是 tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::构建需要 tag ref，当前 ref=${GITHUB_REF}（ref_type=${GITHUB_REF_TYPE}）"
          echo "请改用: gh workflow run \"Docker Build & Publish\" --ref v6.7.0 -f mode=build" >&2
          exit 1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 历史镜像版本留存（运维精简）
  #
  # ⚠️ 为什么不用 actions/delete-package-versions：
  #    该 action 的 min-versions-to-keep 计数单位是「GHCR 包版本条数」，而 GHCR 对同一个
  #    manifest 的多个标签（6.6.0 / 6.6 / v6.6.0 / latest）会登记成**多条版本**。
  #    实测 2026-11-03：设 keep=5 时代码删掉了 97 条版本，连 latest 与 6.4.0/5.7.1/5.6.1
  #    三个发行版一起没了 —— 即"保留 5 条版本"≠"保留 5 个发行版"。
  #
  # ✅ 本 job 的口径：**按发行版本号（semver）分组**，只保留最近 KEEP_VERSIONS(10) 个发行版，
  #    删掉属于更早发行版的所有版本记录（含其浮动别名 5.3 / v5.3.10 等）。
  #    额外硬保护：带 latest 标签的版本永不删除。
  #
  # 触发：任何 tag push 都会跑（含不构建镜像的小版本 tag）—— 小版本不新增镜像，因此这一步
  #       通常"无删除"，成本约 10 s；好处是留存窗口始终被修剪，不会因为长期只打小版本而堆积。
  # 手动清理：Actions → Docker Build & Publish → Run workflow → mode=prune
  # ---------------------------------------------------------------------------
  prune-versions:
    needs: [build-and-push]
    if: always() && (github.ref_type == 'tag' || inputs.mode == 'prune' || inputs.mode == 'all')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 按发行版本号计算保留集并清理更早版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PKG: quant-calendar
        run: |
          set -euo pipefail
          gh api "/users/${OWNER}/packages/container/${PKG}/versions?per_page=100" > /tmp/versions.json
          python3 - <<'PY'
          import json, re, sys
          keep_n = int(__import__("os").environ.get("KEEP_VERSIONS", "5"))
          data = json.load(open("/tmp/versions.json", encoding="utf-8"))
          SEMVER = re.compile(r"^v?(\d+)\.(\d+)\.(\d+)$")

          def release_of(tags):
              cands = [t for t in tags if SEMVER.match(t)]
              if not cands:
                  return None
              pref = [t for t in cands if t.startswith("v")]
              return (pref or cands)[0]

          rows = []
          for v in data:
              tags = (v.get("metadata") or {}).get("container", {}).get("tags") or []
              rel = release_of(tags)
              rows.append({
                  "id": v["id"], "tags": tags, "release": rel,
                  "key": tuple(int(x) for x in SEMVER.match(rel).groups()) if rel else None,
                  "latest": "latest" in tags,
              })

          released = sorted([r for r in rows if r["key"]], key=lambda r: r["key"], reverse=True)
          keep_releases = released[:keep_n]
          kept_names = {r["release"] for r in keep_releases}
          drop = [r for r in rows
                  if r["key"] and r["release"] not in kept_names
                  and not r["latest"]]
          unknown = [r for r in rows if not r["key"] and not r["latest"]]

          print(f"包内版本记录 {len(rows)} 条，发行版 {len(released)} 个")
          print("保留发行版: " + ", ".join(r["release"] for r in keep_releases))
          print(f"待删除版本记录 {len(drop)} 条")
          for r in drop:
              print(f"  ✘ {r['release']:<12} tags={','.join(r['tags'])}")
          if unknown:
              print("未知/无发行号版本（保留不动）: " + ", ".join(",".join(r["tags"]) or f"id={r['id']}" for r in unknown))

          with open("/tmp/drop_ids.txt", "w") as f:
              for r in drop:
                  f.write(str(r["id"]) + "\n")
          with open("/tmp/summary.md", "w") as f:
              f.write("### 镜像版本留存\n")
              f.write(f"- 保留 {len(keep_releases)} 个发行版: " + ", ".join(r["release"] for r in keep_releases) + "\n")
              f.write(f"- 删除 {len(drop)} 条更早版本记录（含浮动别名）\n")
              f.write("- latest 所在版本受硬保护，永不删除\n")
          PY
          if [ -s /tmp/drop_ids.txt ]; then
            while read -r vid; do
              [ -z "$vid" ] && continue
              gh api --method DELETE "/users/${OWNER}/packages/container/${PKG}/versions/${vid}" >/dev/null \
                && echo "已删除 version id=${vid}" \
                || echo "::warning::删除失败 id=${vid}"
            done < /tmp/drop_ids.txt
          fi
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'DEPLOYMENT.md'
      - 'reports/**'
      - '.github/workflows/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'DEPLOYMENT.md'
      - 'reports/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装 uv (锁定版本, 避免解析器漂移)
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.7'
      - name: 校验依赖锁文件未漂移 (FR-3.10.2)
        run: |
          # 跳过文件头 3 行: 头部注释含 -o 输出路径, 与编译目标路径不同, 直接 diff 会恒红
          uv pip compile --universal --python-version 3.11 requirements.in -o /tmp/check-runtime.lock
          diff -u <(tail -n +4 requirements.lock) <(tail -n +4 /tmp/check-runtime.lock)
          uv pip compile --universal --python-version 3.11 -c requirements.lock requirements-dev.in -o /tmp/check-dev.lock
          diff -u <(tail -n +4 requirements-dev.lock) <(tail -n +4 /tmp/check-dev.lock)
      - name: 按锁文件安装依赖
        run: uv pip install --system -r requirements.lock -r requirements-dev.lock
      - name: 生成测试股票名映射 (data/stock_info.json, 供 _resolve_stock_name 等测试)
        run: |
          mkdir -p data
          python - <<'EOF'
          import json
          stock_map = {
              "600085.SH": "同仁堂",
              "000002.SZ": "万科A",
              "600519.SH": "贵州茅台",
              "000001.SZ": "平安银行",
              "600000.SH": "浦发银行",
              "600036.SH": "招商银行",
              "000858.SZ": "五粮液",
              "300750.SZ": "宁德时代",
          }
          with open("data/stock_info.json", "w", encoding="utf-8") as f:
              json.dump(stock_map, f, ensure_ascii=False)
          print(f"stock_info.json written: {len(stock_map)} entries")
          EOF
      - name: Lint
        run: ruff check backend/ --select=E,F,W --ignore=E501
      - name: 测试 + 总覆盖率护栏 (≥20%, FR-3.10.4; e2e 场景单独 job 跑)
        run: python -m pytest tests/ -v --tb=short --cov=backend --cov-report=term --cov-fail-under=20 -m "not e2e"
      - name: 核心模块覆盖率门禁 (美林时钟 ≥70%)
        run: python -m pytest tests/test_merrill_clock.py tests/test_data_sources.py \
             --cov=merrill_clock --cov-report=term --cov-fail-under=70 -m "not e2e"

  # 视觉回归 (FR-3.11.9 / TC-11.14): 截图对比产出 HTML diff 报告。
  # 信息性检查 —— continue-on-error: 有差异不阻塞发布, 报告作为工件供人工审阅。
  e2e-visual:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >-
      !contains(github.event.head_commit.message, 'docs:') &&
      !contains(github.event.head_commit.message, 'chore:')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装 uv (锁定版本)
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.7'
      - name: 按锁文件安装依赖
        run: uv pip install --system -r requirements.lock -r requirements-dev.lock
      - name: 安装 Playwright chromium
        # 与 --system 安装一致: 直接调用系统 python (uv run 会创建空 venv 导致 No module named playwright)
        run: python -m playwright install --with-deps chromium
      - name: 启动 dev server 并跑视觉回归
        run: |
          python -m uvicorn main_new:app --app-dir backend --host 127.0.0.1 --port 8001 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/ >/dev/null && break
            sleep 1
          done
          python tests/e2e/visual_regression.py --report --base-url http://127.0.0.1:8001/
          EXIT_CODE=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $EXIT_CODE
      - name: 上传 diff 报告工件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: |
            tests/e2e/reports/
            tests/e2e/screenshots/
          if-no-files-found: ignore

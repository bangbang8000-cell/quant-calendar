name: CI

# V4.0 精简: CI 只在里程碑版本(tag v*)或手动触发(workflow_dispatch)时运行, 不再随每次 push 触发
# 2026-11-27: 内联 shell 已抽到 scripts/ci/ 共享层，GitHub 与 GitLab 复用同一批门禁脚本。
on:
  push:
    tags:
      - 'v*'          # 里程碑版本: tag v4.0.0 等 → 跑 CI + Docker 发布
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'DEPLOYMENT.md'
      - 'reports/**'
  workflow_dispatch:  # 手动触发: 我单独要求时在 Actions 页 Run workflow

jobs:
  # ── 6.4.5 (FR-652 第 1 条): 门禁三层独立可见 ──
  # 第①层 lint/类型/契约: ruff + 依赖锁 + 版本治理 (失败定位到本层)
  layer1-lint-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装 uv (锁定版本, 避免解析器漂移)
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.7'
      - name: "校验依赖锁文件未漂移 (FR-3.10.2) — scripts/ci/gate-lock-drift.sh"
        run: bash scripts/ci/gate-lock-drift.sh
      - name: 安装 ruff（版本取自 dev 锁文件，避免工具漂移）
        run: |
          V=$(grep -oP '^ruff==\K[0-9.]+' requirements-dev.lock)
          echo "锁定 ruff 版本: ${V}"
          uv pip install --system "ruff==${V}"
      - name: "Lint（ruff，失败时本地跑: ruff check backend/ --select=E,F,W --ignore=E501 --fix）"
        run: bash scripts/ci/gate-lint.sh
      - name: "版本纪律门禁 (tag v* ↔ APP_VERSION 一致, FR-4.5.5) + 版本治理 (T-6.1.0.1)"
        run: bash scripts/ci/gate-version.sh "${GITHUB_REF_NAME:-}"

  # 代码安全 (v7.23): SAST / 密钥泄露阻塞，依赖 CVE 首版仅报告。
  # 放在单测之前：静态问题几十秒即可定位，不必等 8 分钟全量 pytest。
  security:
    runs-on: ubuntu-latest
    needs: layer1-lint-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 按锁文件安装依赖（含安全工具）
        run: pip install -r requirements.lock -r requirements-dev.lock
      - name: "SAST — scripts/ci/security-sast.sh"
        run: bash scripts/ci/security-sast.sh
      - name: "密钥泄露扫描 — scripts/ci/security-secrets.sh"
        run: bash scripts/ci/security-secrets.sh
      - name: "依赖 CVE（report-only）— scripts/ci/security-deps.sh"
        run: bash scripts/ci/security-deps.sh

  # 第②层 单测 + 接口覆盖率: 全量 pytest + 总/模块覆盖率 + 变更覆盖率
  layer2-unit-tests:
    runs-on: ubuntu-latest
    needs: [layer1-lint-contract, security]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装 uv (锁定版本, 避免解析器漂移)
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.7'
      - name: 按锁文件安装依赖
        run: uv pip install --system -r requirements.lock -r requirements-dev.lock
      - name: "测试 + 总覆盖率护栏 (≥40%, FR-3.18.13) — scripts/ci/gate-unit.sh"
        run: bash scripts/ci/gate-unit.sh
      - name: "变更覆盖率门禁 (FR-652 第 2 条) — scripts/ci/gate-diff-coverage.sh"
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            bash scripts/ci/gate-diff-coverage.sh "$GITHUB_BASE_REF"
          else
            bash scripts/ci/gate-diff-coverage.sh
          fi
      - name: "核心/新模块覆盖率门禁 (FR-3.18.13 + 6.3.1~6.3.3) — scripts/ci/gate-coverage-modules.sh"
        run: bash scripts/ci/gate-coverage-modules.sh

  # V5.0.9 T-5.0.91 (TEST-PLAN 10.3): 拆分对拍独立 job — 方法集/import 兼容/行为 golden/覆盖冒烟, fail 即红
  split-parity-gate:
    runs-on: ubuntu-latest
    needs: layer2-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.lock -r requirements-dev.lock
      - name: 拆分对拍 (符号/结构/import/行为/覆盖)
        run: bash scripts/ci/gate-split-parity.sh

  # V5.0.8 T-5.0.81 (TEST-PLAN 9.3): RBAC 权限矩阵独立 job — deny-by-default 守护延续, fail 即红
  rbac-matrix-gate:
    runs-on: ubuntu-latest
    needs: layer2-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.lock -r requirements-dev.lock
      - name: RBAC 权限矩阵 (deny-by-default, 独立红)
        run: bash scripts/ci/gate-rbac.sh

  # V5.0.1 PIT 强制门禁 (TEST-PLAN 2.3): 防前视断言四路径, fail 即红, 独立 job
  pit-gate:
    runs-on: ubuntu-latest
    needs: layer2-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.lock -r requirements-dev.lock
      - name: PIT 防前视断言 (end<=as_of 四路径)
        run: bash scripts/ci/gate-pit.sh

  performance-gate:
    runs-on: ubuntu-latest
    needs: layer2-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.lock -r requirements-dev.lock
      - name: "性能回归 / 体积预算 / 虚拟滚动 / 运行效率 — scripts/ci/gate-perf.sh"
        run: bash scripts/ci/gate-perf.sh

  # 前端 dist 与源码一致性（阻塞门）：重新构建后逐字节比对入库产物。
  # POC 已验证构建确定性（2026-11-27，10 文件 sha256 两次完全一致）。
  dist-sync-gate:
    runs-on: ubuntu-latest
    needs: layer2-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: "重新构建并校验 dist / app.css — scripts/ci/gate-dist-sync.sh"
        run: bash scripts/ci/gate-dist-sync.sh

  # 6.4.3: 构建体积门禁 — 真实构建后按 raw+gzip 度量。
  # continue-on-error: 该项为"可见的告警门"，达标后再去掉开关转阻塞。
  bundle-size-gate:
    runs-on: ubuntu-latest
    needs: layer2-unit-tests
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 前端依赖 + 构建 (scripts/ci/build-frontend.sh)
        run: bash scripts/ci/build-frontend.sh
      - name: "体积报告 + 阈值门禁 — scripts/ci/gate-bundle.sh"
        run: bash scripts/ci/gate-bundle.sh
      - name: 上传体积报告工件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: data/bundle_size.json
          if-no-files-found: ignore
          retention-days: 14

  # 视觉回归 (FR-3.11.9 / TC-11.14): 截图 diff 报告。信息性检查，不阻塞发布。
  # 保留内联：uvicorn 启动与 Playwright 依赖属于平台细节，不进共享脚本层。
  e2e-visual:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >-
      !contains(github.event.head_commit.message, 'docs:') &&
      !contains(github.event.head_commit.message, 'chore:')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装 uv (锁定版本)
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.7'
      - name: 按锁文件安装依赖
        run: uv pip install --system -r requirements.lock -r requirements-dev.lock
      - name: 安装 Playwright chromium
        run: python -m playwright install --with-deps chromium
      - name: 启动 dev server 并跑视觉回归
        run: |
          python -m uvicorn main_new:app --app-dir backend --host 127.0.0.1 --port 8001 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/ >/dev/null && break
            sleep 1
          done
          python tests/e2e/visual_regression.py --report --base-url http://127.0.0.1:8001/
          EXIT_CODE=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $EXIT_CODE
      - name: 上传 diff 报告工件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: |
            tests/e2e/reports/
            tests/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 14

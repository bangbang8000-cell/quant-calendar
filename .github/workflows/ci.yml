name: CI

# V4.0 精简: CI 只在里程碑版本(tag v*)或手动触发(workflow_dispatch)时运行, 不再随每次 push 触发
on:
  push:
    tags:
      - 'v*'          # 里程碑版本: tag v4.0.0 等 → 跑 CI + Docker 发布
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'DEPLOYMENT.md'
      - 'reports/**'
  workflow_dispatch:  # 手动触发: 我单独要求时在 Actions 页 Run workflow

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装 uv (锁定版本, 避免解析器漂移)
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.7'
      - name: 校验依赖锁文件未漂移 (FR-3.10.2)
        run: |
          # 跳过文件头 3 行: 头部注释含 -o 输出路径, 与编译目标路径不同, 直接 diff 会恒红
          uv pip compile --universal --python-version 3.11 requirements.in -o /tmp/check-runtime.lock
          diff -u <(tail -n +4 requirements.lock) <(tail -n +4 /tmp/check-runtime.lock)
          uv pip compile --universal --python-version 3.11 -c requirements.lock requirements-dev.in -o /tmp/check-dev.lock
          diff -u <(tail -n +4 requirements-dev.lock) <(tail -n +4 /tmp/check-dev.lock)
      - name: 按锁文件安装依赖
        run: uv pip install --system -r requirements.lock -r requirements-dev.lock
      - name: 生成测试股票名映射 (data/stock_info.json, 供 _resolve_stock_name 等测试)
        run: |
          mkdir -p data
          python - <<'EOF'
          import json
          stock_map = {
              "600085.SH": "同仁堂",
              "000002.SZ": "万科A",
              "600519.SH": "贵州茅台",
              "000001.SZ": "平安银行",
              "600000.SH": "浦发银行",
              "600036.SH": "招商银行",
              "000858.SZ": "五粮液",
              "300750.SZ": "宁德时代",
          }
          with open("data/stock_info.json", "w", encoding="utf-8") as f:
              json.dump(stock_map, f, ensure_ascii=False)
          print(f"stock_info.json written: {len(stock_map)} entries")
          EOF
      - name: Lint
        run: ruff check backend/ --select=E,F,W --ignore=E501
      - name: 版本纪律门禁 (tag v* ↔ APP_VERSION 一致, FR-4.5.5; workflow_dispatch 仅校验存在)
        run: |
          V=$(grep -oP 'APP_VERSION = "\K[0-9.]+' backend/main_new.py || true)
          if [ -z "$V" ]; then echo "未找到 APP_VERSION"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG=${GITHUB_REF_NAME#v}
            if [ "$TAG" != "$V" ]; then echo "tag=$TAG 与 APP_VERSION=$V 不一致"; exit 1; fi
            echo "版本一致: $V"
          else
            echo "workflow_dispatch/分支触发: 仅校验 APP_VERSION 存在 ($V)"
          fi

      - name: 测试 + 总覆盖率护栏 (≥40%, FR-3.18.13; e2e 场景单独 job 跑)
        run: python -m pytest tests/ -v --tb=short --cov=backend --cov-report=term --cov-fail-under=40 -m "not e2e"
      - name: "核心/新模块覆盖率门禁 (FR-3.18.13: 美林≥70%; 因子IC/事实护栏/决策复盘数据层≥70%; 数据源自愈/复盘激活/事件提醒≥60%)"
        run: |
          python -m pytest tests/test_merrill_clock.py tests/test_data_sources.py \
            --cov=merrill_clock --cov-report=term --cov-fail-under=70 -m "not e2e"
          python -m pytest tests/test_factor_ic.py tests/test_fact_check.py tests/test_eval_track.py \
            --cov=factor_ic --cov=fact_check --cov=eval_track --cov-report=term --cov-fail-under=70 -m "not e2e"
          # 数据源自愈门禁含既有 data_sources 测试 (test_data_sources/test_data_sources_fetch),
          # 否则仅路由测试对 data_sources 覆盖不足 (40% < 60%), CI 恒红
          python -m pytest tests/test_data_source_routing.py tests/test_data_sources.py tests/test_data_sources_fetch.py \
            tests/test_market_review_activation.py tests/test_event_alert_live.py tests/test_market_review.py \
            --cov=data_sources --cov=market_review --cov=event_alert --cov-report=term --cov-fail-under=60 -m "not e2e"
          # V5.1 (T-5.1.1~5.1.6): 数据中台模块覆盖率门禁 ≥70% (TEST-PLAN 2.3)
          python -m pytest tests/test_data_portal2.py tests/test_data_quality.py tests/test_pit_no_lookahead.py             tests/test_data_dict.py tests/test_survivorship.py tests/test_data_lineage.py             --cov=data_portal2 --cov=data_quality --cov=pit --cov=data_dict --cov=survivorship --cov=lineage             --cov-report=term --cov-fail-under=70 -m "not e2e"
          # V5.2 (T-5.2.1~5.2.6): 回测模块覆盖率门禁 ≥70% + 成本敏感度/样本外进入门禁 (TEST-PLAN 3.3)
          python -m pytest tests/test_cost_model.py tests/test_backtest_benchmark.py tests/test_walkforward.py             tests/test_param_stability.py tests/test_attribution.py tests/test_backtest_report.py             --cov=cost_model --cov=benchmark --cov=walkforward --cov=param_stability             --cov=attribution --cov=backtest_report             --cov-report=term --cov-fail-under=70 -m "not e2e"
          # V5.3 (T-5.3.1~5.3.5): 风险/组合模块覆盖率门禁 ≥70% (TEST-PLAN 4.3)
          python -m pytest tests/test_risk_metrics.py tests/test_position_sizing.py tests/test_risk_rules.py             tests/test_risk_events.py tests/test_portfolio_risk_api.py             --cov=risk --cov=rules --cov=risk_events             --cov-report=term --cov-fail-under=70 -m "not e2e"
          # V5.4 T-5.4.1/5.4.2: 通知通道 + 事件引擎 覆盖率门禁 (TEST-PLAN 5.3)
          python -m pytest tests/test_notify_channels.py tests/test_event_engine.py tests/test_alert_rules.py             tests/test_alerts_api.py --cov=notify --cov=events --cov=rules_alert             --cov-report=term --cov-fail-under=70 -m "not e2e"
          # V5.5 T-5.5.1/5.5.2/5.5.3/5.5.5: 报表中心模块覆盖率门禁 ≥70% (TEST-PLAN 6.3)
          python -m pytest tests/test_report_templates.py tests/test_report_export.py             tests/test_report_subscribe.py tests/test_today_highlights.py             --cov=report_center --cov=report_export --cov=report_subscribe             --cov-report=term --cov-fail-under=70 -m "not e2e"
          # V5.7 T-5.7.1/5.7.2/5.7.4: 缓存/任务队列/降采样覆盖率门禁 ≥70% (TEST-PLAN 8.3, 阻塞)
          python -m pytest tests/test_cache2.py tests/test_jobs_queue.py tests/test_jobs_integration.py             tests/test_downsample.py --cov=jobs --cov=cache --cov=downsample             --cov-report=term --cov-fail-under=70 -m "not e2e"
          # V5.8 T-5.8.1/5.8.2/5.8.3/5.8.4/5.8.5: RBAC/协作/APIv3/SDK/插件SDK 覆盖率门禁 ≥70% (TEST-PLAN 9.3, 阻塞)
          python -m pytest tests/test_rbac_matrix.py --cov=rbac --cov-report=term --cov-fail-under=70 -m "not e2e"
          python -m pytest tests/test_collaboration.py --cov=collaboration --cov-report=term --cov-fail-under=70 -m "not e2e"
          python -m pytest tests/test_api_v3.py tests/test_sdk.py --cov=api.v3 --cov=api.v1.watchlist --cov-report=term --cov-fail-under=70 -m "not e2e"
          python -m pytest tests/test_plugins_v2.py --cov=plugin_sdk --cov-report=term --cov-fail-under=70 -m "not e2e"
          # V5.9 T-5.9.1 (TEST-PLAN 10.3): AI 评估拆分后覆盖率不降门禁 ≥50% (拆前 ai_evaluator 同测试集基线)
          python -m pytest tests/test_ai_evaluator.py tests/test_ai_mock.py tests/test_eval_track.py tests/test_fact_check.py             tests/test_api_ai_models.py tests/test_api_batch_evaluate_stream.py tests/test_batch_evaluate_stream.py             tests/test_ai_eval_ui.py --cov=ai_eval --cov=ai_evaluator --cov-report=term --cov-fail-under=50 -m "not e2e"
          # V5.9 T-5.9.2 (TEST-PLAN 10.3): 调度器拆分后覆盖率不降门禁 ≥30% (拆前 scheduler.py 同测试集基线)
          python -m pytest tests/test_scheduler.py tests/test_file_watch.py tests/test_market_review_activation.py             tests/test_v492_day_view_fix.py tests/test_v492_daily_execution.py tests/test_reliability_atomic.py             tests/test_reliability_faults.py tests/test_metrics.py tests/test_holdings_concurrency.py             --cov=scheduler --cov-report=term --cov-fail-under=30 -m "not e2e"
          # V5.9 T-5.9.3 (TEST-PLAN 10.3): 数据源/美林时钟拆分后覆盖率不降门禁 (拆前同测试集基线)
          python -m pytest tests/test_data_sources.py tests/test_data_sources_fetch.py tests/test_data_source_routing.py             tests/test_batch_fetch.py --cov=data_sources --cov-report=term --cov-fail-under=60 -m "not e2e"
          python -m pytest tests/test_merrill_clock.py tests/test_merrill_timeline.py --cov=merrill_clock --cov-report=term --cov-fail-under=70 -m "not e2e"

  # V5.9 T-5.9.1 (TEST-PLAN 10.3): 拆分对拍独立 job — 方法集/import 兼容/行为 golden/覆盖冒烟, fail 即红
  split-parity-gate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.lock
      - name: 拆分对拍 (符号/结构/import/行为/覆盖)
        run: python -m pytest tests/test_split_parity.py -v --tb=short

  # 视觉回归 (FR-3.11.9 / TC-11.14): 截图对比产出 HTML diff 报告。
  # 信息性检查 —— continue-on-error: 有差异不阻塞发布, 报告作为工件供人工审阅。
  # V5.8 T-5.8.1 (TEST-PLAN 9.3): RBAC 权限矩阵独立 job — deny-by-default 守护延续, fail 即红
  rbac-matrix-gate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.lock
      - name: RBAC 权限矩阵 (deny-by-default, 独立红)
        run: python -m pytest tests/test_rbac_matrix.py -v --tb=short

  # V5.1 PIT 强制门禁 (TEST-PLAN 2.3): 防前视断言四路径, fail 即红, 独立 job
  pit-gate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.lock
      - name: PIT 防前视断言 (end<=as_of 四路径)
        run: python -m pytest tests/test_pit_no_lookahead.py -v --tb=short

  e2e-visual:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >-
      !contains(github.event.head_commit.message, 'docs:') &&
      !contains(github.event.head_commit.message, 'chore:')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装 uv (锁定版本)
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.7'
      - name: 按锁文件安装依赖
        run: uv pip install --system -r requirements.lock -r requirements-dev.lock
      - name: 安装 Playwright chromium
        # 与 --system 安装一致: 直接调用系统 python (uv run 会创建空 venv 导致 No module named playwright)
        run: python -m playwright install --with-deps chromium
      - name: 启动 dev server 并跑视觉回归
        run: |
          python -m uvicorn main_new:app --app-dir backend --host 127.0.0.1 --port 8001 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/ >/dev/null && break
            sleep 1
          done
          python tests/e2e/visual_regression.py --report --base-url http://127.0.0.1:8001/
          EXIT_CODE=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $EXIT_CODE
      - name: 上传 diff 报告工件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: |
            tests/e2e/reports/
            tests/e2e/screenshots/
          if-no-files-found: ignore

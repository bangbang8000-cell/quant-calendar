[tool.coverage.report]
# 覆盖率门禁配置 (v3.10 / FR-3.10.4)
# - 核心模块门禁（美林时钟 ≥70%）在 .github/workflows/ci.yml 中通过 --cov-fail-under 执行
# - 总覆盖率门槛随版本递增: v3.10 ≥20%(护栏) → v3.11 ≥30% → v3.12 ≥40% → v3.13 ≥50% → v4.0 ≥60%
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
# e2e: Playwright 端到端视觉回归 (FR-3.11.9 / TC-11.14) — 需要浏览器+dev server, CI 默认排除
markers = [
    "e2e: 端到端视觉回归 (需 Playwright chromium + 本地 dev server, 默认跳过)",
]
